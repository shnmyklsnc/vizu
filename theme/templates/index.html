{% extends "base.html" %}
{% block content %}
<div class="grid">
  {% for article in articles %}
  <div class="card" data-category="{{ article.category.slug }}" data-tags="{{ article.tags|map(attribute='slug')|join(',') }}">
    <a class="card-link" href="{{ SITEURL }}/{{ article.url }}">
      <img src="{{ SITEURL }}/{{ article.thumbnail }}" alt="{{ article.title }}" loading="lazy">
      <h3>{{ article.title }}</h3>
      {{ article.summary }}
    </a>
    {% if article.tags %}
    <div class="tag-row">
      {% for tag in article.tags %}
      <a class="tag-chip" href="{{ SITEURL }}/?tag={{ tag.slug }}">{{ tag.name }}</a>
      {% endfor %}
    </div>
    {% endif %}
  </div>
  {% endfor %}
</div>
<p id="empty-state" class="hint" hidden>No sketches match that filter.</p>
{% endblock %}
