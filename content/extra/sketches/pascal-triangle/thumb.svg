<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400">
  <rect width="600" height="400" fill="#0f0f14"/>

  <!-- Pascal's triangle, rows 0-4, centered left-of-middle -->
  <g font-family="sans-serif" font-size="17" text-anchor="middle" font-weight="bold">
    <!-- row 0 -->
    <circle cx="180" cy="55" r="16" fill="#5ac37a"/>
    <text x="180" y="61" fill="#0f0f14">1</text>

    <!-- row 1 -->
    <circle cx="150" cy="105" r="16" fill="#5ac37a"/>
    <text x="150" y="111" fill="#0f0f14">1</text>
    <circle cx="210" cy="105" r="16" fill="#5ac37a"/>
    <text x="210" y="111" fill="#0f0f14">1</text>

    <!-- row 2 -->
    <circle cx="120" cy="155" r="16" fill="#5ac37a"/>
    <text x="120" y="161" fill="#0f0f14">1</text>
    <circle cx="180" cy="155" r="16" fill="#5ac37a"/>
    <text x="180" y="161" fill="#0f0f14">2</text>
    <circle cx="240" cy="155" r="16" fill="#5ac37a"/>
    <text x="240" y="161" fill="#0f0f14">1</text>

    <!-- row 3 -->
    <circle cx="90"  cy="205" r="16" fill="#5ac37a"/>
    <text x="90" y="211" fill="#0f0f14">1</text>
    <circle cx="150" cy="205" r="16" fill="#5ac37a"/>
    <text x="150" y="211" fill="#0f0f14">3</text>
    <circle cx="210" cy="205" r="16" fill="#5ac37a"/>
    <text x="210" y="211" fill="#0f0f14">3</text>
    <circle cx="270" cy="205" r="16" fill="#5ac37a"/>
    <text x="270" y="211" fill="#0f0f14">1</text>

    <!-- row 4: middle cell (C(4,2)=6) is the highlighted target -->
    <circle cx="60"  cy="255" r="16" fill="#5ac37a"/>
    <text x="60" y="261" fill="#0f0f14">1</text>
    <circle cx="120" cy="255" r="16" fill="#5ac37a"/>
    <text x="120" y="261" fill="#0f0f14">4</text>
    <circle cx="180" cy="255" r="19" fill="#ffd246" stroke="#0f0f14" stroke-width="1.5"/>
    <text x="180" y="261" fill="#0f0f14">6</text>
    <circle cx="240" cy="255" r="16" fill="#5ac37a"/>
    <text x="240" y="261" fill="#0f0f14">4</text>
    <circle cx="300" cy="255" r="16" fill="#5ac37a"/>
    <text x="300" y="261" fill="#0f0f14">1</text>
  </g>

  <!-- small pruned-looking recursion tree, right half, contrasting naive recomputation -->
  <g stroke="#4a4a54" stroke-width="1.5" fill="none">
    <line x1="470" y1="70"  x2="430" y2="115"/>
    <line x1="470" y1="70"  x2="510" y2="115"/>
    <line x1="430" y1="115" x2="405" y2="160"/>
    <line x1="430" y1="115" x2="450" y2="160"/>
    <line x1="510" y1="115" x2="485" y2="160"/>
    <line x1="510" y1="115" x2="530" y2="160"/>
  </g>
  <circle cx="470" cy="70"  r="8" fill="#ffa500"/>
  <circle cx="430" cy="115" r="7" fill="#6d6d78"/>
  <circle cx="510" cy="115" r="7" fill="#6d6d78"/>
  <circle cx="405" cy="160" r="5" fill="#5ac37a"/>
  <circle cx="450" cy="160" r="5" fill="#ffd246"/>
  <circle cx="485" cy="160" r="5" fill="#ffd246"/>
  <circle cx="530" cy="160" r="5" fill="#5ac37a"/>
  <text x="467" y="192" fill="#9d9da8" font-family="sans-serif" font-size="13" text-anchor="middle">same C(2,1) computed twice</text>

  <text x="300" y="335" fill="#5ac37a" font-family="sans-serif" font-size="22" font-weight="bold" text-anchor="middle">C(n,k)  vs  Pascal's triangle</text>
  <text x="300" y="365" fill="#6d6d78" font-family="sans-serif" font-size="15" text-anchor="middle">naive recursion recomputes; the triangle never does</text>
</svg>
