<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400">
  <rect width="600" height="400" fill="#0f0f14"/>

  <!-- a small city loop, left half -->
  <g>
    <circle cx="90"  cy="120" r="7" fill="#ffa500"/>
    <circle cx="200" cy="90"  r="7" fill="#5a8cdc"/>
    <circle cx="230" cy="190" r="7" fill="#5a8cdc"/>
    <circle cx="140" cy="230" r="7" fill="#5a8cdc"/>
    <circle cx="60"  cy="190" r="7" fill="#5a8cdc"/>
  </g>
  <g stroke="#ffd246" stroke-width="2.5" fill="none">
    <path d="M90 120 L 200 90 L 230 190 L 140 230 L 60 190 Z"/>
  </g>
  <text x="145" y="270" fill="#9d9da8" font-family="sans-serif" font-size="14" text-anchor="middle">shortest loop</text>

  <!-- pruned tree, right half -->
  <g stroke="#4a4a54" stroke-width="1.5" fill="none">
    <line x1="440" y1="60"  x2="390" y2="110"/>
    <line x1="440" y1="60"  x2="440" y2="110"/>
    <line x1="440" y1="60"  x2="490" y2="110"/>
    <line x1="390" y1="110" x2="370" y2="160"/>
    <line x1="390" y1="110" x2="410" y2="160"/>
    <line x1="490" y1="110" x2="470" y2="160"/>
    <line x1="490" y1="110" x2="510" y2="160"/>
  </g>
  <circle cx="440" cy="60" r="8" fill="#ffa500"/>
  <circle cx="390" cy="110" r="7" fill="#5ac37a"/>
  <circle cx="440" cy="110" r="7" fill="#6d6d78"/>
  <circle cx="490" cy="110" r="7" fill="#5ac37a"/>
  <circle cx="370" cy="160" r="5" fill="#5ac37a"/>
  <circle cx="410" cy="160" r="5" fill="#5ac37a"/>
  <circle cx="470" cy="160" r="5" fill="#5ac37a"/>
  <circle cx="510" cy="160" r="5" fill="#5ac37a"/>
  <g stroke="#6d6d78" stroke-width="2">
    <line x1="432" y1="102" x2="448" y2="118"/>
    <line x1="432" y1="118" x2="448" y2="102"/>
  </g>
  <text x="440" y="200" fill="#9d9da8" font-family="sans-serif" font-size="14" text-anchor="middle">pruned branch</text>

  <text x="300" y="335" fill="#5ac37a" font-family="sans-serif" font-size="22" font-weight="bold" text-anchor="middle">Held-Karp DP  vs  branch &amp; bound</text>
  <text x="300" y="365" fill="#6d6d78" font-family="sans-serif" font-size="15" text-anchor="middle">two exact ways to skip the (n&#8722;1)! search</text>
</svg>
