<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400">
  <rect width="600" height="400" fill="#0f0f14"/>
  <g>
    <!-- Matrix A: blue 2x2 grid -->
    <rect x="70"  y="130" width="60" height="60" fill="#5a8cdc"/>
    <rect x="130" y="130" width="60" height="60" fill="#4a7cc8"/>
    <rect x="70"  y="190" width="60" height="60" fill="#4a7cc8"/>
    <rect x="130" y="190" width="60" height="60" fill="#5a8cdc"/>
    <g stroke="#0f0f14" stroke-width="2">
      <line x1="130" y1="130" x2="130" y2="250"/>
      <line x1="70" y1="190" x2="190" y2="190"/>
    </g>
  </g>
  <text x="212" y="192" fill="#aaaab4" font-family="sans-serif" font-size="30" text-anchor="middle">&#215;</text>
  <g>
    <!-- Matrix B: purple 2x2 grid -->
    <rect x="240" y="130" width="60" height="60" fill="#c58be0"/>
    <rect x="300" y="130" width="60" height="60" fill="#b378d0"/>
    <rect x="240" y="190" width="60" height="60" fill="#b378d0"/>
    <rect x="300" y="190" width="60" height="60" fill="#c58be0"/>
    <g stroke="#0f0f14" stroke-width="2">
      <line x1="300" y1="130" x2="300" y2="250"/>
      <line x1="240" y1="190" x2="360" y2="190"/>
    </g>
  </g>
  <text x="382" y="192" fill="#aaaab4" font-family="sans-serif" font-size="30" text-anchor="middle">=</text>
  <g>
    <!-- Result C: green 2x2 grid -->
    <rect x="410" y="130" width="60" height="60" fill="#5ac37a"/>
    <rect x="470" y="130" width="60" height="60" fill="#4ab36a"/>
    <rect x="410" y="190" width="60" height="60" fill="#4ab36a"/>
    <rect x="470" y="190" width="60" height="60" fill="#5ac37a"/>
    <g stroke="#0f0f14" stroke-width="2">
      <line x1="470" y1="130" x2="470" y2="250"/>
      <line x1="410" y1="190" x2="530" y2="190"/>
    </g>
  </g>
  <text x="100" y="118" fill="#5a8cdc" font-family="sans-serif" font-size="14" text-anchor="middle">A</text>
  <text x="270" y="118" fill="#c58be0" font-family="sans-serif" font-size="14" text-anchor="middle">B</text>
  <text x="440" y="118" fill="#5ac37a" font-family="sans-serif" font-size="14" text-anchor="middle">C</text>
  <g font-family="sans-serif" text-anchor="middle">
    <text x="300" y="300" fill="#6d6d78" font-size="22" text-decoration="line-through">8 products</text>
    <text x="300" y="335" fill="#ffd246" font-size="26" font-weight="bold">7 products</text>
  </g>
</svg>
