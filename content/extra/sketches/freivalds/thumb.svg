<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400">
  <rect width="600" height="400" fill="#0f0f14"/>
  <g>
    <!-- A: blue 2x2 -->
    <rect x="50"  y="150" width="50" height="50" fill="#5a8cdc"/>
    <rect x="100" y="150" width="50" height="50" fill="#4a7cc8"/>
    <rect x="50"  y="200" width="50" height="50" fill="#4a7cc8"/>
    <rect x="100" y="200" width="50" height="50" fill="#5a8cdc"/>
    <g stroke="#0f0f14" stroke-width="2">
      <line x1="100" y1="150" x2="100" y2="250"/>
      <line x1="50" y1="200" x2="150" y2="200"/>
    </g>
  </g>
  <text x="172" y="212" fill="#aaaab4" font-family="sans-serif" font-size="26" text-anchor="middle">&#215;</text>
  <g>
    <!-- B: purple 2x2 -->
    <rect x="195" y="150" width="50" height="50" fill="#c58be0"/>
    <rect x="245" y="150" width="50" height="50" fill="#b378d0"/>
    <rect x="195" y="200" width="50" height="50" fill="#b378d0"/>
    <rect x="245" y="200" width="50" height="50" fill="#c58be0"/>
    <g stroke="#0f0f14" stroke-width="2">
      <line x1="245" y1="150" x2="245" y2="250"/>
      <line x1="195" y1="200" x2="295" y2="200"/>
    </g>
  </g>
  <text x="317" y="212" fill="#aaaab4" font-family="sans-serif" font-size="20" text-anchor="middle">=?</text>
  <g>
    <!-- C: gray/questionable 2x2 -->
    <rect x="340" y="150" width="50" height="50" fill="#6d6d78"/>
    <rect x="390" y="150" width="50" height="50" fill="#5d5d68"/>
    <rect x="340" y="200" width="50" height="50" fill="#5d5d68"/>
    <rect x="390" y="200" width="50" height="50" fill="#6d6d78"/>
    <g stroke="#0f0f14" stroke-width="2">
      <line x1="390" y1="150" x2="390" y2="250"/>
      <line x1="340" y1="200" x2="440" y2="200"/>
    </g>
  </g>
  <text x="80" y="138" fill="#5a8cdc" font-family="sans-serif" font-size="13" text-anchor="middle">A</text>
  <text x="220" y="138" fill="#c58be0" font-family="sans-serif" font-size="13" text-anchor="middle">B</text>
  <text x="365" y="138" fill="#9d9da8" font-family="sans-serif" font-size="13" text-anchor="middle">C</text>

  <!-- random 0/1 vector r, same length n=2 as A/B/C's dimension -->
  <g font-family="monospace" font-size="16" text-anchor="middle">
    <rect x="472" y="150" width="34" height="50" fill="none" stroke="#ffd246" stroke-width="1.5"/>
    <text x="489" y="181" fill="#ffd246">1</text>
    <rect x="472" y="200" width="34" height="50" fill="none" stroke="#ffd246" stroke-width="1.5"/>
    <text x="489" y="231" fill="#ffd246">0</text>
  </g>
  <text x="489" y="138" fill="#ffd246" font-family="sans-serif" font-size="13" text-anchor="middle">r</text>

  <!-- B, C, and r all feed the check: straight drops to a shared bus, one stem down -->
  <g stroke="#ffd246" stroke-width="2">
    <line x1="245" y1="250" x2="245" y2="280"/>
    <line x1="390" y1="250" x2="390" y2="280"/>
    <line x1="489" y1="250" x2="489" y2="280"/>
    <line x1="245" y1="280" x2="489" y2="280"/>
    <line x1="300" y1="280" x2="300" y2="305"/>
  </g>

  <g font-family="sans-serif" text-anchor="middle">
    <text x="300" y="335" fill="#5ac37a" font-size="24" font-weight="bold">O(n&#178;) check</text>
    <text x="300" y="365" fill="#6d6d78" font-size="17" text-decoration="line-through">no full multiply needed</text>
  </g>
</svg>
