---
layout: default
---
<article class="sketch-page">
  <a class="back-link" href="{{ '/' | relative_url }}">&larr; All sketches</a>
  <h1>{{ page.title }}</h1>
  <p class="meta">{{ page.date | date: "%B %-d, %Y" }}{% if page.tags %} · {{ page.tags | join: ", " }}{% endif %}</p>

  <div id="sketch-holder"></div>

  <div class="description">
    {{ content }}
  </div>
</article>

<!-- p5.js from a CDN, then this sketch's own code -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
<script src="{{ page.script | relative_url }}"></script>
